<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-brand-soft/60 backdrop-blur-xs border border-brand-soft/30 rounded-2xl p-4 shadow-xs w-full transition-all duration-300">
  
  <!-- Left Side: Playback Controls and Status -->
  <div class="flex items-center gap-3.5 min-w-[200px]">
    @if (!isPlaying()) {
      <button (click)="play()" 
              class="flex items-center gap-2 bg-migala hover:bg-migala-dark text-white text-xs font-bold px-4 py-2.5 rounded-xl transition duration-200 shadow-xs hover:shadow-sm cursor-pointer select-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
        </svg>
        Escuchar este apartado
      </button>
    } @else {
      <div class="flex items-end gap-0.5 h-3.5 w-4 shrink-0 pb-0.5">
        <span class="w-1 bg-migala rounded-full h-1.5 animate-bounce [animation-duration:0.6s]" [class.[animation-play-state:paused]]="isPaused()"></span>
        <span class="w-1 bg-migala rounded-full h-3 animate-bounce [animation-duration:0.4s]" [class.[animation-play-state:paused]]="isPaused()"></span>
        <span class="w-1 bg-migala rounded-full h-2 animate-bounce [animation-duration:0.5s]" [class.[animation-play-state:paused]]="isPaused()"></span>
      </div>

      <span class="text-xs font-bold text-muted tracking-wide truncate max-w-[120px]">
        {{ isPaused() ? 'Lectura Pausada' : 'Leyendo...' }}
      </span>

      <div class="flex items-center gap-2 ml-auto">
        @if (isPaused()) {
          <button (click)="resume()" 
                  title="Reanudar"
                  class="p-2 bg-surface text-migala border border-brand-soft rounded-lg hover:bg-migala-light/20 transition cursor-pointer shadow-3xs">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            </svg>
          </button>
        } @else {
          <button (click)="pause()" 
                  title="Pausar"
                  class="p-2 bg-surface text-migala border border-brand-soft rounded-lg hover:bg-migala-light/20 transition cursor-pointer shadow-3xs">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6" />
            </svg>
          </button>
        }

        <button (click)="stop()" 
                title="Detener"
                class="p-2 bg-danger-soft text-danger border border-danger-soft rounded-lg hover:bg-danger/60 transition cursor-pointer shadow-3xs">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 10h6v6H9v-6z" />
          </svg>
        </button>
      </div>
    }
  </div>

  <!-- Right Side: Speech Settings (Voice & Rate) -->
  <div class="flex flex-wrap items-center gap-3.5 pt-3 sm:pt-0 border-t sm:border-t-0 sm:border-l border-brand-soft/40 sm:pl-4">
    @if (voices().length > 1) {
      <div class="flex items-center gap-1.5">
        <label for="voice-select" class="text-[11px] text-dim font-semibold tracking-wide uppercase select-none">Voz:</label>
        <select id="voice-select" 
                (change)="changeVoice($event)" 
                class="bg-surface border border-brand-soft/60 text-xs py-1.5 px-2 rounded-lg text-sub outline-none focus:border-migala focus:ring-1 focus:ring-migala/20 transition cursor-pointer max-w-[150px] truncate shadow-3xs">
          @for (v of voices(); track v.name) {
            <option [value]="v.name" [selected]="selectedVoice()?.name === v.name">
              {{ v.name }}
            </option>
          }
        </select>
      </div>
    }

    <div class="flex items-center gap-1.5">
      <label for="rate-select" class="text-[11px] text-dim font-semibold tracking-wide uppercase select-none">Velocidad:</label>
      <select id="rate-select" 
              (change)="changeRate($event)" 
              class="bg-surface border border-brand-soft/60 text-xs py-1.5 px-2 rounded-lg text-sub outline-none focus:border-migala focus:ring-1 focus:ring-migala/20 transition cursor-pointer shadow-3xs">
        @for (speed of [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2]; track speed) {
          <option [value]="speed" [selected]="rate() === speed">
            {{ speed }}x
          </option>
        }
      </select>
    </div>
  </div>

</div>
