<header class="w-full bg-white border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <img src="assets/img/Logo.png" alt="Logo Proyecto Migala" class="h-12 w-auto object-contain">
      <img src="assets/img/Titulo.png" alt="Proyecto Migala" class="h-6 w-auto object-contain">
    </div>
    <nav class="flex items-center space-x-8 text-xs font-semibold text-gray-600 tracking-wide">
      <a routerLink="/" routerLinkActive="text-migala border-b-2 border-migala pb-1" [routerLinkActiveOptions]="{exact:true}" class="hover:text-migala transition">Inicio</a>
      <a routerLink="/transparencia" routerLinkActive="text-migala border-b-2 border-migala pb-1" class="hover:text-migala transition">Transparencia</a>
      <a routerLink="/archivo" routerLinkActive="text-migala border-b-2 border-migala pb-1" class="hover:text-migala transition">Archivo</a>
      <a routerLink="/privacidad" routerLinkActive="text-migala border-b-2 border-migala pb-1" class="hover:text-migala transition text-right leading-tight">Aviso de<br>privacidad</a>
    </nav>
  </div>
</header>
